name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (shellcheck, warnings and errors)
        run: shellcheck --version && shellcheck -s bash -S warning install.sh loader.sh ble-early.sh bashrc.d/*.sh tests/*.sh
      - name: Installer safety tests
        run: bash tests/test-install.sh
