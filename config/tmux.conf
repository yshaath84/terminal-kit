# --- basics ---
set -g mouse on                      # click panes, drag borders, scroll with wheel
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- easy keys (prefix stays Ctrl-b) ---
bind | split-window -h -c "#{pane_current_path}"    # Ctrl-b |  split side by side
bind - split-window -v -c "#{pane_current_path}"    # Ctrl-b -  split top/bottom
bind c new-window -c "#{pane_current_path}"
bind -n M-Left  select-pane -L                      # Alt+arrows move between panes (no prefix)
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind r source-file ~/.tmux.conf \; display "reloaded"

# --- Tokyo Night look ---
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
set -g status-right "#[fg=#565f89]%H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#283457,fg=#c0caf5,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#283457,fg=#c0caf5"
